steps:
- name: 'gcr.io/cloud-builders/mvn'
  args: ['package', '-Dquarkus.package.type=uber-jar']
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'asia-southeast1-docker.pkg.dev/your-gcp-project-id/your-artifact-registry-repo/client-service:latest', '.']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'asia-southeast1-docker.pkg.dev/your-gcp-project-id/your-artifact-registry-repo/client-service:latest']
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - 'client-service'
  - '--image'
  - 'asia-southeast1-docker.pkg.dev/your-gcp-project-id/your-artifact-registry-repo/client-service:latest'
  - '--region'
  - 'asia-southeast1'
  - '--platform'
  - 'managed'
  - '--allow-unauthenticated'
images:
- 'asia-southeast1-docker.pkg.dev/your-gcp-project-id/your-artifact-registry-repo/client-service:latest'
